name: Apply Miss B homepage image fix

on:
  push:
    branches:
      - image-stage-missbs-home-food

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staging base
        shell: bash
        run: |
          set -euo pipefail
          expected="a35aa86978d0ecbdca4bc0fae8b436d30a986392"
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || { echo "Main moved: expected $expected, got $actual"; exit 1; }

      - name: Install exact source images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/images/keystatic/home-food-grid
          mkdir -p src/assets/images/keystatic/home-food-featured

          curl --fail --location --retry 3 'https://chatgpt.com/backend-api/estuary/content?id=file_00000000cf5c81f79e32f5139d2eef2b&ts=496817&p=fs&cid=1&sig=4658162bdca55fe11cf216abe3003a6cf592eda0a53fcd093312f194540403ba&v=0' -o src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-favorites-tacos.jpg
          curl --fail --location --retry 3 'https://chatgpt.com/backend-api/estuary/content?id=file_000000001ddc8230a04724a261e9f1f3&ts=496817&p=fs&cid=1&sig=40ee9fe0f1eb81b3d1bc31c1d0e44557b5bba72fdcf20ec161418ffb85223a8e&v=0' -o src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-poke-bowl.jpg
          curl --fail --location --retry 3 'https://chatgpt.com/backend-api/estuary/content?id=file_000000006e70823088bbcc3e5fae2353&ts=496817&p=fs&cid=1&sig=38a1918548c24c4818e161d4f49fbaff7794ebc911d2d5b3db5c513c5e422321&v=0' -o src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-caribbean-bbq-chicken-salad.jpg

          echo '419978cff58b068d8824804296aae258b15bd640c85b85fbbabaa20170eb0b45  src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-favorites-tacos.jpg' | sha256sum --check --strict
          echo '78a59bc2c3bc538aa316a671bb11949e0f949be039de5d70d1a939aed77c5e13  src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-poke-bowl.jpg' | sha256sum --check --strict
          echo '4b58de337dd1a2d35f115ca572fe3165a253d16d957c90fe2ac6e9572e995c4a  src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-caribbean-bbq-chicken-salad.jpg' | sha256sum --check --strict

          cp public/images/keystatic/home-food-grid/miss-bs-coconut-club-food-mission-beach-13.webp src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-food-mission-beach-13.webp
          cp public/images/keystatic/home-food-featured/miss-bs-coconut-club-food-mission-beach-09.webp src/assets/images/keystatic/home-food-featured/miss-bs-coconut-club-food-mission-beach-09.webp

      - name: Wire Astro responsive image pipeline
        shell: python
        run: |
          from pathlib import Path
          import json

          index_path = Path('src/pages/index.astro')
          index = index_path.read_text()

          old_import = "import { getEntry } from 'astro:content';"
          new_import = "import { getEntry } from 'astro:content';\nimport { Picture } from 'astro:assets';"
          if old_import not in index:
              raise SystemExit('Expected astro:content import not found')
          index = index.replace(old_import, new_import, 1)

          old_food_const = "const foodRight    = page.food?.grid ?? [];"
          new_food_const = """const homeFoodGridImages = import.meta.glob('../assets/images/keystatic/home-food-grid/*.{jpg,jpeg,png,webp,avif}', { eager: true, import: 'default' }) as Record<string, any>;
const homeFoodFeaturedImages = import.meta.glob('../assets/images/keystatic/home-food-featured/*.{jpg,jpeg,png,webp,avif}', { eager: true, import: 'default' }) as Record<string, any>;
const resolveOptimizedImage = (src: string, images: Record<string, any>, directory: string) => {
  const filename = src.split('/').pop();
  const key = `../assets/images/keystatic/${directory}/${filename}`;
  const image = images[key];
  if (!image) throw new Error(`Missing optimized image asset: ${key}`);
  return image;
};
const foodRight = (page.food?.grid ?? []).map((item: { src: string; name: string; alt?: string }) => ({
  ...item,
  image: resolveOptimizedImage(item.src, homeFoodGridImages, 'home-food-grid'),
}));
const featuredFoodImage = resolveOptimizedImage(page.food.featured.src, homeFoodFeaturedImages, 'home-food-featured');"""
          if old_food_const not in index:
              raise SystemExit('Expected foodRight declaration not found')
          index = index.replace(old_food_const, new_food_const, 1)

          old_featured = '''          <img
            src={page.food.featured.src}
            alt={page.food.featured.alt}
            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
            loading="lazy"
          />'''
          new_featured = '''          <Picture
            src={featuredFoodImage}
            formats={['avif', 'webp']}
            widths={[480, 720, 960, 1200]}
            sizes="(min-width: 1280px) 426px, 33vw"
            quality={90}
            alt={page.food.featured.alt}
            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
            loading="lazy"
            decoding="async"
          />'''
          if old_featured not in index:
              raise SystemExit('Expected featured food img block not found')
          index = index.replace(old_featured, new_featured, 1)

          old_grid = '''            <img
              src={item.src}
              alt={"Miss B's Coconut Club " + item.name + " Mission Beach San Diego"}
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
            />'''
          new_grid = '''            <Picture
              src={item.image}
              formats={['avif', 'webp']}
              widths={[320, 480, 640, 960]}
              sizes="(min-width: 1280px) 426px, 33vw"
              quality={90}
              alt={item.alt ?? ("Miss B's Coconut Club " + item.name + " Mission Beach San Diego")}
              class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
              loading="lazy"
              decoding="async"
            />'''
          if old_grid not in index:
              raise SystemExit('Expected food grid img block not found')
          index = index.replace(old_grid, new_grid, 1)
          index_path.write_text(index)

          home_path = Path('src/content/home/home.json')
          home = json.loads(home_path.read_text())
          home['food']['featured']['src'] = '../../assets/images/keystatic/home-food-featured/miss-bs-coconut-club-food-mission-beach-09.webp'
          grid = home['food']['grid']
          if len(grid) != 4:
              raise SystemExit(f'Expected 4 food-grid items, got {len(grid)}')
          grid[0]['src'] = '../../assets/images/keystatic/home-food-grid/miss-bs-coconut-club-food-mission-beach-13.webp'
          grid[1].update({
              'src': '../../assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-favorites-tacos.jpg',
              'name': "Miss B's Favorites Tacos",
              'alt': "Miss B's Favorites tacos at Miss B's Coconut Club in Mission Beach San Diego",
          })
          grid[2].update({
              'src': '../../assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-poke-bowl.jpg',
              'name': 'Poke Bowl',
              'alt': "Poke bowl at Miss B's Coconut Club in Mission Beach San Diego",
          })
          grid[3].update({
              'src': '../../assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-caribbean-bbq-chicken-salad.jpg',
              'name': 'Caribbean BBQ Chicken Salad',
              'alt': "Caribbean BBQ chicken salad at Miss B's Coconut Club in Mission Beach San Diego",
          })
          home_path.write_text(json.dumps(home, indent=2) + '\n')

          key_path = Path('keystatic.config.ts')
          key = key_path.read_text()
          marker = '''  return fields.image(options);
}

const plainLabel'''
          replacement = '''  return fields.image(options);
}

function optimizedImageField(
  namespace: string,
  { label, required = true, description }: ImageFieldOptions,
) {
  const options = {
    label,
    description:
      description ??
      `${required ? "Required" : "Optional"} image used for ${label.toLowerCase()} on the website. Astro generates responsive AVIF/WebP derivatives from this source image.`,
    directory: `src/assets/images/keystatic/${namespace}`,
    publicPath: `../../assets/images/keystatic/${namespace}/`,
    ...(required ? { validation: { isRequired: true as const } } : {}),
  } as Parameters<typeof fields.image>[0];
  return fields.image(options);
}

const optimizedImageCard = (namespace: string, label = "Image Card") =>
  fields.object(
    {
      src: optimizedImageField(namespace, { label: "Image" }),
      name: text("Name"),
      alt: text("Image Description for Accessibility"),
    },
    { label },
  );

const plainLabel'''
          if marker not in key:
              raise SystemExit('Expected Keystatic image helper marker not found')
          key = key.replace(marker, replacement, 1)
          old_featured_field = 'featured: imageCard("home-food-featured", "Featured Dish"),'
          new_featured_field = 'featured: optimizedImageCard("home-food-featured", "Featured Dish"),'
          if old_featured_field not in key:
              raise SystemExit('Expected featured Keystatic field not found')
          key = key.replace(old_featured_field, new_featured_field, 1)
          old_grid_field = 'src: imageField("home-food-grid", { label: "Image" }),' 
          new_grid_field = 'src: optimizedImageField("home-food-grid", { label: "Image" }),' 
          if old_grid_field not in key:
              raise SystemExit('Expected food-grid Keystatic field not found')
          key = key.replace(old_grid_field, new_grid_field, 1)
          key_path.write_text(key)

      - name: Verify Keystatic and Astro build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify:keystatic
          npm run build

      - name: Commit verified result to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage-missbs-home-food.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets src/pages/index.astro src/content/home/home.json keystatic.config.ts
          git diff --cached --check
          git commit -m 'Optimize Miss B homepage food images with Astro'
          git push origin HEAD:main

name: Apply Miss B homepage image fix

on:
  push:
    branches:
      - image-stage-missbs-home-food

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production base has not moved
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "a35aa86978d0ecbdca4bc0fae8b436d30a986392"

      - name: Install exact source images
        run: |
          set -euo pipefail
          mkdir -p src/assets/images/keystatic/home-food-grid
          mkdir -p src/assets/images/keystatic/home-food-featured
          curl --fail --location --retry 3 'https://chatgpt.com/backend-api/estuary/content?id=file_00000000cf5c81f79e32f5139d2eef2b&ts=496817&p=fs&cid=1&sig=4658162bdca55fe11cf216abe3003a6cf592eda0a53fcd093312f194540403ba&v=0' -o src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-favorites-tacos.jpg
          curl --fail --location --retry 3 'https://chatgpt.com/backend-api/estuary/content?id=file_000000001ddc8230a04724a261e9f1f3&ts=496817&p=fs&cid=1&sig=40ee9fe0f1eb81b3d1bc31c1d0e44557b5bba72fdcf20ec161418ffb85223a8e&v=0' -o src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-poke-bowl.jpg
          curl --fail --location --retry 3 'https://chatgpt.com/backend-api/estuary/content?id=file_000000006e70823088bbcc3e5fae2353&ts=496817&p=fs&cid=1&sig=38a1918548c24c4818e161d4f49fbaff7794ebc911d2d5b3db5c513c5e422321&v=0' -o src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-caribbean-bbq-chicken-salad.jpg
          echo '419978cff58b068d8824804296aae258b15bd640c85b85fbbabaa20170eb0b45  src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-favorites-tacos.jpg' | sha256sum -c -
          echo '78a59bc2c3bc538aa316a671bb11949e0f949be039de5d70d1a939aed77c5e13  src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-poke-bowl.jpg' | sha256sum -c -
          echo '4b58de337dd1a2d35f115ca572fe3165a253d16d957c90fe2ac6e9572e995c4a  src/assets/images/keystatic/home-food-grid/miss-bs-coconut-club-mission-beach-caribbean-bbq-chicken-salad.jpg' | sha256sum -c -
          cp public/images/keystatic/home-food-grid/miss-bs-coconut-club-food-mission-beach-13.webp src/assets/images/keystatic/home-food-grid/
          cp public/images/keystatic/home-food-featured/miss-bs-coconut-club-food-mission-beach-09.webp src/assets/images/keystatic/home-food-featured/

      - name: Apply scoped Astro image patch
        run: python3 scripts/apply-missbs-home-food.py

      - name: Verify Keystatic and full Astro build
        run: |
          set -euo pipefail
          npm ci
          npm run verify:keystatic
          npm run build

      - name: Create one production commit and push main once
        run: |
          set -euo pipefail
          git reset --soft origin/main
          git reset
          rm -f .github/workflows/stage-missbs-home-food.yml scripts/apply-missbs-home-food.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets src/pages/index.astro src/content/home/home.json keystatic.config.ts
          git diff --cached --check
          git commit -m 'Optimize Miss B homepage food images with Astro'
          git push origin HEAD:main
